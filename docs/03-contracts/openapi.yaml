openapi: 3.1.0
info:
  title: Сквозной билет — Booking API
  version: 1.0.0
  description: 'Локальная учебная версия: один тестовый пользователь, заранее заданные маршруты, условные деньги.'
servers:
  - url: http://localhost:8080
paths:
  /bookings:
    post:
      operationId: createBooking
      summary: Создать покупку маршрута
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBooking'
            example:
              routeId: train-ferry-01
      responses:
        '202':
          description: Заказ сохранён. Повтор возвращает исходный ответ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Accepted'
              example:
                bookingId: 69367e73-7ac4-4bb5-8d44-621ac650fa30
          headers:
            Location:
              schema:
                type: string
              description: Адрес GET /bookings/{bookingId}.
        '400':
          description: Некорректный запрос.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Маршрут не найден.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Ключ уже использован с другим routeId.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Повторить с тем же ключом и телом.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /bookings/{bookingId}:
    get:
      operationId: getBooking
      summary: Получить состояние покупки
      parameters:
        - name: bookingId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Текущее сохранённое состояние.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '404':
          description: Заказ не найден.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Сервис временно недоступен.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    CreateBooking:
      type: object
      required:
        - routeId
      properties:
        routeId:
          type: string
          minLength: 1
          maxLength: 128
    Accepted:
      type: object
      required:
        - bookingId
      properties:
        bookingId:
          type: string
          format: uuid
    Booking:
      type: object
      required:
        - bookingId
        - status
        - amountMinor
        - currency
      properties:
        bookingId:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - PROCESSING
            - COMPLETED
            - CANCELLING
            - CANCELLED
        amountMinor:
          type: integer
          minimum: 1
          maximum: 100000000
        currency:
          type: string
          enum:
            - RUB
        reservations:
          type: array
          minItems: 2
          maxItems: 2
          items:
            $ref: '#/components/schemas/Reservation'
          description: Оба номера брони возвращаются только при COMPLETED.
    Reservation:
      type: object
      required:
        - legId
        - reservationId
      properties:
        legId:
          type: integer
          enum:
            - 1
            - 2
        reservationId:
          type: string
          minLength: 1
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
